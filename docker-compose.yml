services:
    alpine-dev:
        build:
            context: .
            dockerfile: Dockerfile
        image: capstone:fullstack
        container_name: capstone-fullstack
        volumes:
            - ./backend:/app/backend
            - ./.vscode:/app/.vscode
            - ./requirements.txt:/app/requirements.txt
            - ~/.gitconfig:/home/appuser/.gitconfig:ro
        develop:
            watch:
                - action: sync
                  path: ./frontend/
                  target: /app/frontend
                  ignore:
                      - node_modules
                      - dist
                      - build
                - action: rebuild
                  path: ./requirements.txt
                - action: rebuild
                  path: ./Dockerfile
        ports:
            - '5173:5173'
            - '3000:3000'
            - '8000:8000'
        stdin_open: true
        tty: true
        working_dir: /app

        command: /app/startup.sh
        restart: unless-stopped

        # healthcheck:
