services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        ports:
            - 5173:5173
        develop:
            watch:
                - action: sync
                  path: ./frontend/
                  target: /frontend
                  ignore:
                      - node_modules
    backend:
        build:
            context: .
        ports:
            - 8000:8000
            - 3000:3000
        volumes:
            - ./backend:/backend
